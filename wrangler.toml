# Inoni: ein einziger Cloudflare-Worker, liefert das HUD (Ordner web) und die API (/api/*).
# Der Name muss dem bestehenden Worker "inoni" entsprechen.
name = "inoni"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"
# Im Dashboard gesetzte Variablen bleiben beim Deploy erhalten.
keep_vars = true

[assets]
directory = "./web"
binding = "ASSETS"
# Nur Aufrufe unter /api/ laufen durch den Worker-Code, alles andere liefert Cloudflare direkt als Seite aus.
run_worker_first = ["/api/*"]

# Workers AI: das kostenlose Gehirn. Das Gratis-Kontingent gilt täglich, danach schlagen Anfragen fehl.
[ai]
binding = "AI"

[observability]
enabled = true

[vars]
# Format: GITHUB-NAME/REPO-NAME, das Repo mit dem Ordner memory/
MEMORY_REPO = "lejoker3251-dot/INONI"
# Modell für Workers AI. Alternativen siehe README.
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Wird nur benutzt, wenn das Secret ANTHROPIC_API_KEY gesetzt ist.
CLAUDE_MODEL = "claude-sonnet-5-5"
# Stimme: Fish Audio. Wird nur benutzt, wenn das Secret FISH_API_KEY gesetzt ist.
# Die Gratisphase von s2.1-pro-free läuft laut Anbieter bis 30.11.2026, danach Preise prüfen.
FISH_MODEL = "s2.1-pro-free"
# Optional: ID einer deutschen Stimme aus der Fish-Stimmenbibliothek. Leer lassen = Standardstimme.
FISH_VOICE_ID = ""
ALLOWED_ORIGIN = "https://inoni.420joker-68b.workers.dev"
