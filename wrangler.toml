# Ein einziger Cloudflare-Worker: liefert das HUD (Ordner web) und die API (/api/*).
# Der Name muss dem bestehenden Worker "inoni" entsprechen.
name = "inoni"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./web"
binding = "ASSETS"
# Nur Aufrufe unter /api/ laufen durch den Worker-Code, alles andere liefert Cloudflare direkt als Seite aus.
run_worker_first = ["/api/*"]

[observability]
enabled = true

[vars]
# Format: GITHUB-NAME/REPO-NAME, das Repo mit dem Ordner memory/
MEMORY_REPO = "lejoker3251-dot/INONI"
CLAUDE_MODEL = "claude-sonnet-5-5"
ALLOWED_ORIGIN = "https://inoni.420joker-68b.workers.dev"
